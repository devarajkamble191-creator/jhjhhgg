<style id="app-css">
/* Layout: sticky header, hero, filter row, product grid, slide-in drawer (cart, checkout, store settings, product form), fixed edit bar for the owner. */
:root{

    --hot:#F5B04A; --tile:#1A2521; --danger:#FF8A80; color-scheme:dark;

}

  --accent:color-mix(in srgb, var(--brand,#0B6B5C) 60%, #ffffff); --accent-fg:#06120E;
  --hot:#F5B04A; --tile:#1A2521; --danger:#FF8A80; color-scheme:dark;
}
*{box-sizing:border-box}
body{

<script id="app-js">
var dataEl = document.getElementById('store-data');
var store = JSON.parse(dataEl.textContent);
var ui = {cat:'All', q:'', sort:'featured', cart:{}, view:null, order:null, editing:false, canEdit:false, dirty:false,
          editId:null, draft:null, confirmDel:null, status:''};
try { var saved = JSON.parse(localStorage.getItem('dev-cart')||'{}'); if (saved && typeof saved==='object') ui.cart = saved; } catch(e){}
function persistCart(){ try{ localStorage.setItem('dev-cart', JSON.stringify(ui.cart)); }catch(e){} }

var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function inr(n){ n = Number(n)||0; return (store.currency||'') + n.toLocaleString(store.currency==='₹'?'en-IN':'en-US',{maximumFractionDigits:2}); }
function byId(id){ return store.products.filter(function(p){return p.id===id;})[0]; }
function safeImg(u){ return typeof u==='string' && u.indexOf('data:image/')===0 ? u : ''; }

function cap(name){
  try { return window.claude && window.claude.use ? window.claude.use(name).catch(function(){return null;}) : Promise.resolve(null); }
  catch(e){ return Promise.resolve(null); }
}

function glyph(cat){
  var s = 'fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"';
  var g = {

  return '<svg viewBox="0 0 120 80" '+s+' aria-hidden="true">'+(g[cat]||g.Kits)+'</svg>';
}
function visual(p){ var u = safeImg(p.img); return u ? '<img src="'+esc(u)+'" alt="'+esc(p.name)+'">' : glyph(p.cat); }

/* ---------- theme from store settings ---------- */
function applyBrand(){
  var c = /^#[0-9a-f]{6}$/i.test(store.brand) ? store.brand : '#0B6B5C';
  var r = parseInt(c.slice(1,3),16), g = parseInt(c.slice(3,5),16), b = parseInt(c.slice(5,7),16);
  var lum = (0.299*r + 0.587*g + 0.114*b)/255;
  var root = document.documentElement;
  root.style.setProperty('--brand', c);
  root.style.setProperty('--brand-fg', lum > 0.6 ? '#101614' : '#FFFFFF');
  document.title = store.name || 'Store';
}

/* ---------- storefront ---------- */
function cats(){
  var out = [];
  store.products.forEach(function(p){ if (p.cat && out.indexOf(p.cat)===-1) out.push(p.cat); });
  return out;
}
function visible(){
  var q = ui.q.trim().toLowerCase();
  var list = store.products.filter(function(p){
    if (ui.cat!=='All' && p.cat!==ui.cat) return false;
    if (!q) return true;
    return (p.name+' '+p.cat+' '+p.spec).toLowerCase().indexOf(q) !== -1;
  });
  var s = ui.sort;
  if (s==='low') list.sort(function(a,b){return a.price-b.price;});
  else if (s==='high') list.sort(function(a,b){return b.price-a.price;});
  else if (s==='name') list.sort(function(a,b){return a.name.localeCompare(b.name);});
  else list.sort(function(a,b){return (b.feat?1:0)-(a.feat?1:0);});
  return list;
}

function renderBrand(){
  var logo = safeImg(store.logo);
  var nameHtml = esc(store.name||'');

  if (logo) inner = '<img src="'+esc(logo)+'" alt="'+(store.showName?'':esc(store.name))+'">' + (store.showName ? '<span>'+nameHtml+'</span>' : '');
  else inner = '<span>'+nameHtml+'<i>_</i></span>';
  $('brand').innerHTML = inner;
  $('brand').setAttribute('aria-label', (store.name||'Store')+' home');

    if (ui.editing){
      tools = ui.confirmDel===p.id
        ? '<div class="tools"><button class="mini del" data-delyes="'+esc(p.id)+'">Delete?</button><button class="mini" data-delno="1">Keep</button></div>'
        : '<div class="tools"><button class="mini" data-edit="'+esc(p.id)+'">Edit</button><button class="mini del" data-del="'+esc(p.id)+'">Delete</button></div>';
    }
    return '<article class="card"><div class="tile">'+visual(p)+tag+tools+'</div>'+
      '<div class="cbody"><p class="cat">'+esc(p.cat)+'</p><h3>'+esc(p.name)+'</h3><p class="spec">'+esc(p.spec)+'</p>'+
      '<div class="buy"><div class="price"><strong>'+inr(p.price)+'</strong>'+(p.mrp>p.price?'<s>'+inr(p.mrp)+'</s>':'')+'</div>'+
      '<button class="btn" data-add="'+esc(p.id)+'" '+(p.out?'disabled':'')+' aria-label="Add '+esc(p.name)+' to cart">'+(p.out?'Sold out':'Add')+'</button></div></div></article>';
  }).join('');
}
function renderFoot(){
  var cols = '<div><strong style="color:var(--fg);font-family:var(--font-display)">'+esc(store.name)+'</strong>'+(store.tagline?'<br>'+esc(store.tagline):'')+'</div>';
  if (store.footer) cols += '<div>'+esc(store.footer)+'</div>';
  if (store.contact) cols += '<div>'+esc(store.contact)+'</div>';
  if (!waNumber()) cols += '<div>Demo storefront: orders are not processed and no payment is taken.</div>';
  $('foot').innerHTML = '<div class="wrap fgrid">'+cols+'</div>';
}
function renderEditbar(){
  var el = $('editbar');
  document.body.classList.toggle('editing', ui.editing);
  if (!ui.editing){ el.hidden = true; el.innerHTML=''; return; }
  el.hidden = false;
  el.innerHTML = '<div class="st"><b>Editing store</b> &middot; '+(ui.status ? esc(ui.status) : (ui.dirty?'Unsaved changes':'No changes yet'))+'</div>'+
    '<button class="btn ghost small" data-open="settings">Store settings</button>'+
    '<button class="btn ghost small" data-open="newproduct">Add product</button>'+
    '<button class="btn ghost small" id="discard">'+(ui.dirty?'Discard':'Exit')+'</button>'+
    '<button class="btn small" id="publish" '+(ui.dirty?'':'disabled')+'>Save &amp; publish</button>';
}
function renderPageParts(){ renderBrand(); renderHbtns(); renderHero(); renderChips(); renderGrid(); renderFoot(); renderEditbar(); }

/* ---------- cart ---------- */
function cartItems(){
  return Object.keys(ui.cart).map(function(id){ var p=byId(id); return (p && !p.out)?{p:p,n:ui.cart[id]}:null; }).filter(Boolean);
}
function totals(){
  var sub = cartItems().reduce(function(a,i){return a+i.p.price*i.n;},0);
  var ship = sub===0 ? 0 : ((store.freeAt>0 && sub>=store.freeAt) ? 0 : store.ship);
  return {sub:sub, ship:ship, total:sub+ship};
}
var toastTimer;
function toast(msg){ var t=$('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(function(){t.hidden=true;},1800); }
function add(id){
  var p = byId(id); if (!p || p.out) return;
  ui.cart[id] = (ui.cart[id]||0)+1; persistCart(); renderHbtns();
  toast(p.name+' added to cart');
  if (ui.view==='cart') renderDrawer();
}
function setQty(id,n){
  if (n<=0) delete ui.cart[id]; else ui.cart[id]=Math.min(n,20);
  persistCart(); renderHbtns(); renderDrawer();
}
function waNumber(){ return String(store.whatsapp||'').replace(/\D/g,''); }

/* ---------- drawer ---------- */
function openDrawer(view){ ui.view = view; renderDrawer(); }
function closeDrawer(){ ui.view = null; $('layer').innerHTML=''; }
function fld(id,label,type,ac){
  return '<div class="fld"><label for="f-'+id+'">'+label+'</label><input id="f-'+id+'" name="'+id+'" type="'+type+'" autocomplete="'+ac+'"><div class="err" id="e-'+id+'"></div></div>';
}
function sfld(key,label,type,extra){
  var v = store[key]; if (v==null) v='';
  return '<div class="fld"><label for="s-'+key+'">'+label+'</label><input id="s-'+key+'" data-set="'+key+'" type="'+type+'" value="'+esc(v)+'" '+(extra||'')+'></div>';
}
function pfld(id,label,type,val,extra){
  return '<div class="fld"><label for="'+id+'">'+label+'</label><input id="'+id+'" type="'+type+'" value="'+esc(val==null?'':val)+'" '+(extra||'')+'><div class="err" id="e-'+id+'"></div></div>';
}

function renderDrawer(){
  var v = ui.view; if (!v) return;
  var t = totals(), items = cartItems(), body='', foot='', title='Your cart';
  if (v==='cart'){
    if (!items.length){
      body = '<p class="empty" style="padding:40px 0">Your cart is empty. Add something to get started.</p>';
    } else {
      body = items.map(function(i){
        return '<div class="line"><div class="thumb">'+visual(i.p)+'</div><div class="info"><p class="nm">'+esc(i.p.name)+'</p>'+
          '<p class="pr">'+inr(i.p.price)+' each</p>'+
          '<div><span class="qty"><button data-dec="'+esc(i.p.id)+'" aria-label="Decrease quantity">&minus;</button><span>'+i.n+'</span><button data-inc="'+esc(i.p.id)+'" aria-label="Increase quantity">+</button></span>'+
          '<button class="rm" data-rm="'+esc(i.p.id)+'">Remove</button></div></div>'+
          '<div class="pr" style="color:var(--fg)">'+inr(i.p.price*i.n)+'</div></div>';
      }).join('');
      foot = '';
      if (store.freeAt>0){
        var pct = Math.min(100, Math.round(t.sub/store.freeAt*100));
        foot += '<div class="free" aria-hidden="true"><i style="width:'+pct+'%"></i></div>'+
          '<p class="note">'+(t.sub>=store.freeAt?'You get free delivery on this order.':'Add '+inr(store.freeAt-t.sub)+' more for free delivery.')+'</p>';
      }
      foot += '<div class="row"><span>Subtotal</span><span>'+inr(t.sub)+'</span></div>'+
        '<div class="row"><span>Delivery</span><span>'+(t.ship?inr(t.ship):'Free')+'</span></div>'+
        '<div class="row total"><span>Total</span><span>'+inr(t.total)+'</span></div>'+
        (store.priceNote?'<p class="note">'+esc(store.priceNote)+'</p>':'')+
        '<button class="btn block" data-go="checkout">Checkout</button>';
    }
  } else if (v==='checkout'){
    title = 'Checkout';
    body = '<form class="co" id="coForm" novalidate>'+
      fld('name','Full name','text','name')+fld('email','Email','email','email')+fld('phone','Phone (10 digits)','tel','tel')+
      fld('addr','Address','text','street-address')+
      '<div class="two">'+fld('city','City','text','address-level2')+fld('pin','PIN code','text','postal-code')+'</div>'+
      '<p class="note">'+(waNumber()?'After you place the order you can send it to the shop on WhatsApp.':'Demo checkout: no payment is taken and nothing is shipped.')+'</p></form>';
    foot = '<div class="row total"><span>Total ('+items.length+(items.length===1?' item':' items')+')</span><span>'+inr(t.total)+'</span></div>'+
      '<button class="btn block" id="place">Place order</button><button class="btn ghost block" data-go="cart">Back to cart</button>';
  } else if (v==='done'){
    title = 'Order placed';
    var o = ui.order;
    body = '<div class="done"><h3>Thanks, '+esc(o.name.split(' ')[0])+'.</h3><p>Your order <code>'+esc(o.id)+'</code> for '+inr(o.total)+' is recorded.</p>'+
      (o.wa ? '<p>Send it to the shop so they can confirm and arrange payment and delivery.</p><a class="btn block" href="'+esc(o.wa)+'" target="_blank" rel="noopener">Send order on WhatsApp</a>'
            : '<p class="note">This is a demo store. The order was not sent to the shop and no payment was taken.</p>')+'</div>';
    foot = '<button class="btn ghost block" data-close="1">Keep shopping</button>';
  } else if (v==='settings'){
    title = 'Store settings';
    var logo = safeImg(store.logo);
    body = '<div class="co">'+
      '<p class="sect" style="border:0;padding:0;margin:0">Brand</p>'+
      sfld('name','Store name','text')+
      '<div class="fld"><label>Logo</label><div class="pick"><div class="preview">'+(logo?'<img src="'+esc(logo)+'" alt="">':'No logo')+'</div>'+
        '<label class="btn ghost small" for="logoFile" style="cursor:pointer">Upload logo</label><input class="sr" id="logoFile" type="file" accept="image/*">'+
        (logo?'<button class="btn ghost small" data-logoremove="1">Remove</button>':'')+'</div><div class="err" id="e-logo"></div></div>'+
      '<label class="chk"><input type="checkbox" data-set="showName" '+(store.showName?'checked':'')+'> Show store name next to the logo</label>'+
      '<div class="fld"><label for="s-brand">Brand colour</label><input id="s-brand" data-set="brand" type="color" value="'+esc(store.brand)+'"></div>'+
      '<p class="sect">Homepage</p>'+
      sfld('tagline','Headline','text')+
      '<div class="fld"><label for="s-sub">Intro text</label><textarea id="s-sub" data-set="sub" rows="3">'+esc(store.sub)+'</textarea></div>'+
      '<p class="sect">Pricing and delivery</p>'+
      '<div class="two">'+sfld('currency','Currency symbol','text','maxlength="4"')+sfld('freeAt','Free delivery above (0 = off)','number','min="0" step="any" inputmode="decimal"')+'</div>'+
      sfld('ship','Delivery fee','number','min="0" step="any" inputmode="decimal"')+
      sfld('priceNote','Note under totals (for example about tax)','text')+
      '<p class="sect">Orders and contact</p>'+
      sfld('whatsapp','WhatsApp number for orders (with country code, digits only)','tel','placeholder="919876543210"')+
      '<p class="note">With a number here, customers can send their order to you on WhatsApp after checkout. Without it the checkout is a demo.</p>'+
      sfld('contact','Contact line in the footer (email, phone, address)','text')+
      '<div class="fld"><label for="s-footer">Footer text (one line per row)</label><textarea id="s-footer" data-set="footer" rows="3">'+esc(store.footer)+'</textarea></div>'+
      '</div>';
    foot = '<p class="note">Changes show on the page right away. Choose "Save &amp; publish" in the bar to make them live.</p><button class="btn block" data-close="1">Done</button>';
  } else if (v==='product'){
    var d = ui.draft;
    title = ui.editId ? 'Edit product' : 'Add product';
    var dl = cats().map(function(c){return '<option value="'+esc(c)+'">';}).join('');
    body = '<div class="co">'+
      pfld('pname','Product name','text',d.name,'autocomplete="off"')+
      pfld('pcat','Category','text',d.cat,'list="catlist" autocomplete="off"')+'<datalist id="catlist">'+dl+'</datalist>'+
      '<div class="two">'+pfld('pprice','Price','number',d.price,'min="0" step="any" inputmode="decimal"')+pfld('pmrp','Original price (optional)','number',d.mrp||'','min="0" step="any" inputmode="decimal"')+'</div>'+
      pfld('pspec','Short description','text',d.spec,'autocomplete="off"')+
      '<div class="fld"><label>Photo</label><div class="pick"><div class="preview" id="pprev">'+(safeImg(d.img)?'<img src="'+esc(safeImg(d.img))+'" alt="">':'No photo')+'</div>'+
        '<label class="btn ghost small" for="pimg" style="cursor:pointer">Upload photo</label><input class="sr" id="pimg" type="file" accept="image/*">'+
        '<button class="btn ghost small" data-imgremove="1">Remove</button></div><div class="err" id="e-pimg"></div></div>'+
      '<label class="chk"><input type="checkbox" id="pfeat" '+(d.feat?'checked':'')+'> Show first (featured)</label>'+
      '<label class="chk"><input type="checkbox" id="pout" '+(d.out?'checked':'')+'> Sold out</label>'+
      '</div>';
    foot = '<button class="btn block" id="saveProd">'+(ui.editId?'Save product':'Add product')+'</button><button class="btn ghost block" data-close="1">Cancel</button>';
  }
  $('layer').innerHTML = '<div class="scrim" data-close="1"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="'+esc(title)+'">'+
    '<div class="dhead"><h2>'+esc(title)+'</h2><button class="iconbtn" data-close="1" aria-label="Close">Close</button></div>'+
    '<div class="dbody">'+body+'</div>'+(foot?'<div class="dfoot">'+foot+'</div>':'')+'</aside>';
}

function validate(){
  var rules = {
    name:[/\S{2,}/,'Enter your full name.'],
    email:[/^[^\s@]+@[^\s@]+\.[^\s@]+$/,'Enter a valid email address.'],
    phone:[/^\d{10}$/,'Enter a 10-digit phone number.'],
    addr:[/\S{4,}/,'Enter your delivery address.'],
    city:[/\S{2,}/,'Enter your city.'],
    pin:[/^\d{6}$/,'Enter a 6-digit PIN code.']
  };
  var ok = true, data = {};
  Object.keys(rules).forEach(function(k){
    var v = $('f-'+k).value.trim(); data[k]=v;
    var good = rules[k][0].test(v);
    $('e-'+k).textContent = good ? '' : rules[k][1];
    if (!good) ok = false;
  });
  if (!ok){ var first = document.querySelector('#coForm .err:not(:empty)'); if (first) first.previousElementSibling.focus(); }
  return ok ? data : null;
}

function placeOrder(){
  var d = validate(); if (!d) return;
  var t = totals(), items = cartItems();
  var id = 'ORD-'+Math.floor(100000+Math.random()*900000);
  var wa = '';
  if (waNumber()){
    var lines = items.map(function(i){ return i.n+' x '+i.p.name+' - '+inr(i.p.price*i.n); });
    var text = 'New order '+id+'\n\n'+lines.join('\n')+'\n\nDelivery: '+(t.ship?inr(t.ship):'Free')+'\nTotal: '+inr(t.total)+
      '\n\nName: '+d.name+'\nPhone: '+d.phone+'\nEmail: '+d.email+'\nAddress: '+d.addr+', '+d.city+' '+d.pin;
    wa = 'https://wa.me/'+waNumber()+'?text='+encodeURIComponent(text);
  }
  ui.order = {id:id, name:d.name, total:t.total, wa:wa};
  ui.cart = {}; persistCart(); renderHbtns(); ui.view='done'; renderDrawer();
}

/* ---------- editing ---------- */
function readImage(file, max, type){
  return new Promise(function(resolve, reject){
    var fr = new FileReader();
    fr.onerror = function(){ reject(new Error('read')); };
    fr.onload = function(){
      var im = new Image();
      im.onerror = function(){ reject(new Error('decode')); };
      im.onload = function(){
        var s = Math.min(1, max/Math.max(im.width, im.height, 1));
        var c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(im.width*s)); c.height = Math.max(1, Math.round(im.height*s));
        var x = c.getContext('2d');
        if (type==='image/jpeg'){ x.fillStyle='#ffffff'; x.fillRect(0,0,c.width,c.height); }
        x.drawImage(im,0,0,c.width,c.height);
        resolve(c.toDataURL(type, 0.82));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function newDraft(){ return {name:'',cat:'',price:'',mrp:0,spec:'',img:'',out:false,feat:false}; }
function openProduct(id){
  ui.editId = id || null;
  var p = id ? byId(id) : null;
  ui.draft = p ? JSON.parse(JSON.stringify(p)) : newDraft();
  if (!p && ui.cat!=='All') ui.draft.cat = ui.cat;
  openDrawer('product');
}
function saveProduct(){
  var d = ui.draft;
  var name = $('pname').value.trim(), cat = $('pcat').value.trim() || 'General';
  var price = parseFloat($('pprice').value), mrp = parseFloat($('pmrp').value) || 0;
  var ok = true;
  $('e-pname').textContent = name ? '' : 'Enter a product name.'; if (!name) ok = false;
  var badPrice = isNaN(price) || price < 0;
  $('e-pprice').textContent = badPrice ? 'Enter a price.' : ''; if (badPrice) ok = false;
  if (!ok) return;
  d.name = name; d.cat = cat; d.price = price; d.mrp = mrp; d.spec = $('pspec').value.trim();
  d.feat = $('pfeat').checked; d.out = $('pout').checked;
  if (ui.editId){
    store.products = store.products.map(function(p){ return p.id===ui.editId ? d : p; });
  } else {
    d.id = 'p'+Date.now().toString(36)+Math.floor(Math.random()*1000).toString(36);
    store.products.push(d);
  }
  ui.dirty = true; ui.status = ''; closeDrawer(); renderPageParts();
  toast(ui.editId ? 'Product updated' : 'Product added');
}

var FONT_LINK = '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap">';
var FALLBACK_RESET = ':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
function buildDoc(){
  var reset = FALLBACK_RESET;
  var styles = document.head ? document.head.querySelectorAll('style') : [];
  for (var i=0;i<styles.length;i++){ if (styles[i].id!=='app-css' && /color-scheme/.test(styles[i].textContent)){ reset = styles[i].textContent; break; } }
  var css = $('app-css').textContent, js = $('app-js').textContent;
  var data = JSON.stringify(store).replace(/</g,'\\u003c');
  var content = '<title>'+esc(store.name||'Store')+'</title><meta name="claude:viewport-fit-sides" content="cover">'+FONT_LINK+
    '<style id="app-css">'+css+'</style><div id="app"></div><div id="layer"></div><div class="toast" id="toast" role="status" hidden></div>'+
    '<script type="application/json" id="store-data">'+data+'<\/script><script id="app-js">'+js+'<\/script>';
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+content+'</body></html>';
}
function publish(){
  ui.status = 'Saving...'; renderEditbar();
  cap('artifact').then(function(art){
    if (!art){ ui.status = 'Publishing is not available in this view.'; renderEditbar(); return; }
    return art.publish(buildDoc()).then(function(){ ui.status = 'Published'; renderEditbar(); });
  }).catch(function(e){
    var c = e && e.code;
    ui.status = c==='conflict' ? 'Someone else published first. Reloading to their version.'
      : (c==='not_granted' || c==='not_writer') ? 'You do not have permission to publish changes.'
      : 'Could not publish. Try again.';
    renderEditbar();
  });
}
function discard(){
  if (ui.dirty){ store = JSON.parse(dataEl.textContent); ui.dirty = false; applyBrand(); }
  ui.editing = false; ui.status = ''; ui.confirmDel = null; closeDrawer(); renderPageParts();
}

/* ---------- events ---------- */
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-cat],[data-add],[data-inc],[data-dec],[data-rm],[data-go],[data-close],[data-open],[data-edit],[data-del],[data-delyes],[data-delno],[data-logoremove],[data-imgremove],#openCart,#editToggle,#place,#saveProd,#publish,#discard');
  if (!el) return;
  var ds = el.dataset;
  if (ds.cat){ ui.cat = ds.cat; renderChips(); renderGrid(); }
  else if (ds.add) add(ds.add);
  else if (ds.inc) setQty(ds.inc, (ui.cart[ds.inc]||0)+1);
  else if (ds.dec) setQty(ds.dec, (ui.cart[ds.dec]||0)-1);
  else if (ds.rm) setQty(ds.rm, 0);
  else if (ds.go){ ui.view = ds.go; renderDrawer(); }
  else if (ds.close) closeDrawer();
  else if (ds.open==='settings') openDrawer('settings');
  else if (ds.open==='newproduct') openProduct(null);
  else if (ds.edit) openProduct(ds.edit);
  else if (ds.del){ ui.confirmDel = ds.del; renderGrid(); }
  else if (ds.delno){ ui.confirmDel = null; renderGrid(); }
  else if (ds.delyes){
    store.products = store.products.filter(function(p){ return p.id!==ds.delyes; });
    delete ui.cart[ds.delyes]; persistCart();
    ui.confirmDel = null; ui.dirty = true; ui.status = ''; renderPageParts(); toast('Product deleted');
  }
  else if (ds.logoremove){ store.logo = ''; ui.dirty = true; renderPageParts(); renderDrawer(); }
  else if (ds.imgremove){ ui.draft.img = ''; $('pprev').textContent = 'No photo'; }
  else if (el.id==='openCart') openDrawer('cart');
  else if (el.id==='editToggle'){ ui.editing = true; ui.status = ''; renderPageParts(); }
  else if (el.id==='place') placeOrder();
  else if (el.id==='saveProd') saveProduct();
  else if (el.id==='publish') publish();
  else if (el.id==='discard') discard();
});
document.addEventListener('keydown', function(e){ if (e.key==='Escape' && ui.view) closeDrawer(); });
document.addEventListener('input', function(e){
  var t = e.target, k = t.dataset && t.dataset.set;
  if (!k) return;
  var v = t.type==='checkbox' ? t.checked : t.value;
  if (k==='freeAt' || k==='ship') v = Math.max(0, parseFloat(v)||0);
  store[k] = v; ui.dirty = true; ui.status = '';
  applyBrand(); renderPageParts();
});
document.addEventListener('change', function(e){
  var t = e.target;
  if (t.id==='logoFile' && t.files && t.files[0]){
    readImage(t.files[0], 360, 'image/png').then(function(u){ store.logo = u; ui.dirty = true; ui.status=''; renderPageParts(); renderDrawer(); })
      .catch(function(){ var er=$('e-logo'); if (er) er.textContent = 'That file could not be read as an image.'; });
  } else if (t.id==='pimg' && t.files && t.files[0]){
    readImage(t.files[0], 800, 'image/jpeg').then(function(u){ ui.draft.img = u; $('pprev').innerHTML = '<img src="'+esc(u)+'" alt="">'; $('e-pimg').textContent=''; })
      .catch(function(){ var er=$('e-pimg'); if (er) er.textContent = 'That file could not be read as an image.'; });
  } else if (t.id==='sort'){ ui.sort = t.value; renderGrid(); }
});

/* ---------- start ---------- */
$('app').innerHTML =
  '<header class="top"><div class="wrap bar"><a class="logo" href="#top" id="brand"></a>'+
  '<div class="search"><label class="sr" for="q">Search products</label><input id="q" type="search" placeholder="Search products" autocomplete="off"></div>'+
  '<div class="hbtns" id="hbtns"></div></div></header>'+
  '<main class="wrap" id="top"><section class="hero" id="hero"></section>'+
  '<div class="filters"><div class="chips" id="chips" role="group" aria-label="Categories"></div>'+
  '<label class="sort">Sort <select id="sort"><option value="featured">Featured</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option><option value="name">Name</option></select></label></div>'+
  '<p class="note" id="result" aria-live="polite" style="margin-bottom:14px"></p>'+
  '<section class="grid" id="grid" aria-label="Products"></section></main>'+
  '<footer id="foot"></footer><div class="editbar" id="editbar" hidden></div>';
$('q').addEventListener('input', function(e){ ui.q = e.target.value; renderGrid(); });
applyBrand();
renderPageParts();
cap('user').then(function(u){
  try { if (u && u.canEdit && u.canEdit()){ ui.canEdit = true; renderHbtns(); } } catch(e){}
});
